version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: dal-postgres
    environment:
      POSTGRES_DB: crud_db
      POSTGRES_USER: dal_user
      POSTGRES_PASSWORD: dal_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dal_user -d crud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local